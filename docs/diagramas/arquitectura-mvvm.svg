<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="623" viewBox="0 0 1140 623" role="img" aria-labelledby="title desc">
  <title id="title">VisiónRUT · Arquitectura MVVM</title><desc id="desc">Las pantallas envían acciones al ViewModel y observan su StateFlow. Las reglas de dominio, el repositorio Room y el adaptador Android tienen responsabilidades separadas.</desc>
